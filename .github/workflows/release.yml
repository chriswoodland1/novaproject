name: Release APK

# Indítás: git tag push, pl.  git tag v1.0.0 && git push origin v1.0.0
# Az app a GitHub Releases "latest" kiadását figyeli; a verziót a tagből kapja (v1.0.0 -> 1.0.0).
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Verzió (pl. 1.0.0) – a workflow létrehozza a v1.0.0 taget"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Az ubuntu-latest runneren előre telepített Android SDK van (ANDROID_HOME beállítva).
      - name: Android SDK csomagok
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Aláíró kulcs visszaállítása a secretekből
        env:
          KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Hiányzik a NOVA_KEYSTORE_BASE64 secret. Lásd README → Aláírás. Állandó kulcs nélkül az app nem tud önmagára frissíteni."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nova.jks"
          echo "NOVA_KEYSTORE_PATH=$RUNNER_TEMP/nova.jks" >> "$GITHUB_ENV"

      - name: Verzió a tagből vagy a kézi bemenetből
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"; VER="${VER#v}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VER" -m "NovaProcess $VER"
            git push origin "v$VER"
          else
            TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          fi
          echo "NOVA_VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "NOVA_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: APK átnevezése
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NovaProcess-${NOVA_VERSION_NAME}.apk"

      - name: GitHub Release létrehozása
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NOVA_VERSION_NAME }}
          name: NovaProcess ${{ env.NOVA_VERSION_NAME }}
          files: dist/*.apk
          generate_release_notes: true
