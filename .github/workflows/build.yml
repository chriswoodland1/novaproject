name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Az ubuntu-latest runneren előre telepített Android SDK van (ANDROID_HOME beállítva).
      - name: Android SDK csomagok
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        env:
          NOVA_VERSION_NAME: 0.0.${{ github.run_number }}
          NOVA_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NovaProcess-debug-apk
          path: app/build/outputs/apk/debug/*.apk
